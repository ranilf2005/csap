name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  backend:
    name: Backend lint & test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: csap
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: csap_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://csap:testpassword@localhost:5432/csap_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      CREDENTIAL_ENCRYPTION_KEY: dGVzdC1rZXktZm9yLWNpLW9ubHktMzItYnl0ZXMtbG8=
      CSAP_ADMIN_PASSWORD: ci-test-password-123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff
      - name: Lint
        working-directory: backend
        run: ruff check app
      - name: Test
        working-directory: backend
        run: pytest -q --cov=app --cov-report=term-missing

  images:
    name: Build images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [backend, frontend, nginx]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.component }}
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          push: false
          load: true
          tags: csap-${{ matrix.component }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  stack:
    name: End-to-end stack smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate .env
        run: |
          cp .env.example .env
          sed -i "s|^SECRET_KEY=.*|SECRET_KEY=$(openssl rand -hex 32)|" .env
          sed -i "s|^CREDENTIAL_ENCRYPTION_KEY=.*|CREDENTIAL_ENCRYPTION_KEY=$(openssl rand -base64 32 | tr '+/' '-_')|" .env
          sed -i "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=ci-postgres-pass|" .env
          sed -i "s|^REDIS_PASSWORD=.*|REDIS_PASSWORD=ci-redis-pass|" .env
          sed -i "s|^CSAP_ADMIN_PASSWORD=.*|CSAP_ADMIN_PASSWORD=ci-admin-password-1|" .env
          sed -i "s|^HTTP_PORT=.*|HTTP_PORT=8080|" .env
          sed -i "s|^HTTPS_PORT=.*|HTTPS_PORT=8443|" .env
      - name: Generate TLS certificate
        run: |
          mkdir -p nginx/certs
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -keyout nginx/certs/csap.key -out nginx/certs/csap.crt \
            -subj "/CN=localhost" -addext "subjectAltName=DNS:localhost"
          # nginx runs as uid 101 in the container and must own the key to read it
          sudo chown -R 101:101 nginx/certs
      - name: Start stack
        run: docker compose up -d --build
      - name: Wait for API
        run: |
          for i in $(seq 1 40); do
            if curl -ksSf https://localhost:8443/api/v1/health/ready; then exit 0; fi
            sleep 6
          done
          echo "::error::stack did not become ready"
          docker compose logs --no-color
          exit 1
      - name: Verify login works
        run: |
          curl -ksSf -X POST https://localhost:8443/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin@example.com","password":"ci-admin-password-1"}' | grep -q access_token
      - name: Tear down
        if: always()
        run: docker compose down -v
