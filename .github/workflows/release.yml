name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.1.0)"
        required: true

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Build & publish images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [backend, frontend, nginx]
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          VERSION="${{ github.event.inputs.version }}"
          [ -z "$VERSION" ] && VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.component }}
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/csap-${{ matrix.component }}:${{ steps.ver.outputs.version }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/csap-${{ matrix.component }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
            org.opencontainers.image.title=CSAP ${{ matrix.component }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  bundle:
    name: Publish customer bundle
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          VERSION="${{ github.event.inputs.version }}"
          [ -z "$VERSION" ] && VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Assemble deployment bundle
        run: |
          V="${{ steps.ver.outputs.version }}"
          DIR="csap-$V"
          mkdir -p "$DIR/scripts" "$DIR/nginx/certs"
          cp docker-compose.yml README.md "$DIR/"
          cp .env.example "$DIR/.env.example"
          cp scripts/*.sh "$DIR/scripts/"
          chmod +x "$DIR"/scripts/*.sh
          sed -i "s|^CSAP_VERSION=.*|CSAP_VERSION=$V|" "$DIR/.env.example"
          sed -i "s|^IMAGE_NAMESPACE=.*|IMAGE_NAMESPACE=${{ github.repository_owner }}|" "$DIR/.env.example"
          tar czf "csap-$V.tar.gz" "$DIR"
          sha256sum "csap-$V.tar.gz" > "csap-$V.tar.gz.sha256"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: CSAP ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            csap-${{ steps.ver.outputs.version }}.tar.gz
            csap-${{ steps.ver.outputs.version }}.tar.gz.sha256
          body: |
            ## Cisco Security Automation Platform ${{ steps.ver.outputs.version }}

            ### Install
            ```bash
            curl -fsSLO https://github.com/${{ github.repository }}/releases/download/v${{ steps.ver.outputs.version }}/csap-${{ steps.ver.outputs.version }}.tar.gz
            tar xzf csap-${{ steps.ver.outputs.version }}.tar.gz
            cd csap-${{ steps.ver.outputs.version }}
            ./scripts/install.sh
            ```

            ### Images
            - `ghcr.io/${{ github.repository_owner }}/csap-backend:${{ steps.ver.outputs.version }}`
            - `ghcr.io/${{ github.repository_owner }}/csap-frontend:${{ steps.ver.outputs.version }}`
            - `ghcr.io/${{ github.repository_owner }}/csap-nginx:${{ steps.ver.outputs.version }}`
