name: csap

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [csap_net]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [csap_net]

  backend:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-ranilf2005}/csap-backend:${CSAP_VERSION:-0.3.9}
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: [.env]
    environment:
      CSAP_ROLE: api
      # Composed here (not in .env) because env_file values are not interpolated.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    volumes:
      - csap_data:/data
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/health/live', timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks: [csap_net]

  worker:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-ranilf2005}/csap-backend:${CSAP_VERSION:-0.3.9}
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: [.env]
    environment:
      CSAP_ROLE: worker
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    volumes:
      - csap_data:/data
    depends_on:
      backend: {condition: service_healthy}
    networks: [csap_net]

  frontend:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-ranilf2005}/csap-frontend:${CSAP_VERSION:-0.3.9}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: [.env]
    depends_on:
      backend: {condition: service_healthy}
    networks: [csap_net]

  nginx:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-ranilf2005}/csap-nginx:${CSAP_VERSION:-0.3.9}
    build:
      context: ./nginx
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:8080"
      - "${HTTPS_PORT:-443}:8443"
    volumes:
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on: [backend, frontend]
    networks: [csap_net]

volumes:
  postgres_data:
  redis_data:
  csap_data:

networks:
  csap_net:
    driver: bridge
