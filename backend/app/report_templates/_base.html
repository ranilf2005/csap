<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{ title }}</title>
<style>
  :root { --navy:#0d274d; --line:#e3e8ef; --muted:#5b6b7f; }
  * { box-sizing:border-box; }
  body { margin:0; padding:0 0 60px; background:#f5f7fa; color:#1a2433;
         font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  header { background:linear-gradient(90deg,var(--navy),#14508c); color:#fff; padding:28px 32px; }
  header h1 { margin:0 0 6px; font-size:22px; font-weight:600; }
  header .meta { opacity:.85; font-size:13px; }
  main { max-width:1200px; margin:24px auto; padding:0 24px; }
  section { background:#fff; border:1px solid var(--line); border-radius:8px; margin-bottom:20px; overflow:hidden; }
  section > h2 { margin:0; padding:14px 18px; font-size:15px; font-weight:600;
                 border-bottom:1px solid var(--line); background:#fbfcfe; }
  .body { padding:18px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th { text-align:left; background:#fbfcfe; color:var(--muted); font-weight:600;
       padding:9px 14px; border-bottom:1px solid var(--line); white-space:nowrap; }
  td { padding:9px 14px; border-bottom:1px solid #f0f3f7; vertical-align:top; }
  tr:last-child td { border-bottom:0; }
  .cards { display:flex; flex-wrap:wrap; gap:14px; padding:18px; }
  .card { flex:1 1 150px; background:#fbfcfe; border:1px solid var(--line); border-radius:6px; padding:14px 16px; }
  .card .label { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.04em; }
  .card .value { font-size:26px; font-weight:600; margin-top:4px; }
  .badge { display:inline-block; padding:2px 9px; border-radius:11px; font-size:11px; font-weight:600; }
  .b-error { background:#fdecec; color:#a01b1b; }
  .b-warning { background:#fff5e0; color:#8a5b00; }
  .b-info, .b-planned { background:#e8f1fd; color:#144d9c; }
  .b-ok, .b-created, .b-updated, .b-deleted, .b-reverted { background:#e6f6ec; color:#106b32; }
  .b-failed { background:#fdecec; color:#a01b1b; }
  .b-neutral { background:#eef1f5; color:#455468; }
  .empty { padding:22px 18px; color:var(--muted); }
  code { background:#f2f5f9; padding:1px 5px; border-radius:3px; font-size:12px; }
  footer { max-width:1200px; margin:0 auto; padding:0 24px; color:var(--muted); font-size:12px; }
  @media print { body { background:#fff; } section { break-inside:avoid; } }
</style>
</head>
<body>
<header>
  <h1>{{ title }}</h1>
  <div class="meta">
    {% if connection %}{{ connection.name }} &middot; {{ connection.host }} &middot; {% endif %}
    Generated {{ generated_at }} by CSAP {{ platform_version }}
  </div>
</header>
<main>
{% block content %}{% endblock %}
</main>
<footer>Cisco Security Automation Platform &middot; report id is embedded in the file name</footer>
</body>
</html>
