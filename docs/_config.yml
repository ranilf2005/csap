title: Cisco Security Automation Platform
description: >-
  Discover, validate and deploy Cisco security configuration from a reviewed
  Excel workbook. Prototype - use at your own risk.

url: https://ranilf2005.github.io
baseurl: /csap

remote_theme: just-the-docs/just-the-docs@v0.7.0
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

search_enabled: true
