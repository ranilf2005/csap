{% extends "base.html" %}
{% block title %}Change password | CSAP{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-6 col-lg-5">
    <div class="card mt-4">
      <div class="card-header fw-semibold">Change your password</div>
      <div class="card-body">
        {% if error %}<div class="alert alert-danger py-2">{{ error }}</div>{% endif %}
        {% if success %}<div class="alert alert-success py-2">{{ success }}</div>{% endif %}

        <form method="post" action="/account/password">
          <div class="mb-3">
            <label class="form-label" for="current_password">Current password</label>
            <input class="form-control" id="current_password" name="current_password" type="password"
                   required autocomplete="current-password">
          </div>
          <div class="mb-3">
            <label class="form-label" for="new_password">New password</label>
            <input class="form-control" id="new_password" name="new_password" type="password"
                   required minlength="12" maxlength="72" autocomplete="new-password">
            <div class="form-text">At least 12 characters.</div>
          </div>
          <div class="mb-4">
            <label class="form-label" for="confirm_password">Confirm new password</label>
            <input class="form-control" id="confirm_password" name="confirm_password" type="password"
                   required minlength="12" maxlength="72" autocomplete="new-password">
          </div>
          <button class="btn btn-primary w-100" type="submit">Update password</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
